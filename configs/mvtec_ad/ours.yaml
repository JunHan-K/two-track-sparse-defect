# Ours (final) on MVTec AD.
experiment_id: mvtec_ours
seed: 42
output_root: outputs
data:
  name: MVTecAD
  split_version: mvtec_ds_seed42_v1
  core_split: data/splits/mvtec_ds/core.csv
  train_split: data/splits/mvtec_ds/core.csv
  mining_split: data/splits/mvtec_ds/mining.csv
  val_split: data/splits/mvtec_ds/val.csv
  test_split: data/splits/mvtec_ds/test.csv
  input_size: [512, 512]
  mask_resize_threshold: 0.5
  subset: all15
  category_from_id: true
model: {type: segformer, pretrained: pretrained/mit-b0, head: stagewise, rep_dim: 128, head_hidden: 32, lambda_aux: 1.0, fusion: none}
train:
  epochs: 20
  batch_size: 8
  eval_batch_size: 8
  grad_accum: 1
  lr: 3.0e-05
  head_lr_mult: 10.0
  weight_decay: 0.01
  scheduler: poly
  poly_power: 1.0
  warmup_ratio: 0.05
  amp: false
  grad_clip: 1.0
  eval_interval: 1
  num_workers: 4
  deterministic: false
  aug: {hflip: 0.5, vflip: 0.5, brightness: 0.1, contrast: 0.1}
  size_weight: {a_ref: auto, beta: 1.0, cap: 4.0}
  size_split:
    heads: [s1, s2]
    area_px: auto
    margin: 3
  zoom: {crop: 384, every: 2, batch: 8, p_defect: 0.5}
refine: {enabled: true, init_checkpoint: outputs/mvtec_ours_stage1/best.pt, replay_file: data/replay/mvtec_ad/mvtec_ours_stage1.json,
  replay_type: native_fp, full_per_replay: 3, replay_batch_size: 8, match_budget: true}
