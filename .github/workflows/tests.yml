name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU)
        run: |
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Synthetic end-to-end run (train, mine, refine, evaluate)
        env:
          SDS_E2E: "1"
        run: python -m pytest tests/test_e2e.py -q
