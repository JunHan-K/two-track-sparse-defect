[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-defect-seg"
version = "1.0.0"
description = "Twin-SparSight: lightweight two-track segmentation for sparse defect inspection (ICCE 2027)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Junhan Kim" }]
requires-python = ">=3.10"
# torch / torchvision: install the build for your CUDA version first (see requirements.txt and scripts/setup_env.sh)
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40,<5",
  "huggingface_hub",
  "safetensors",
  "segmentation-models-pytorch==0.3.4",
  "timm==0.9.7",
  "numpy<2",
  "scipy",
  "pillow",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib"]

[project.urls]
Repository = "https://github.com/JunHan-K/two-track-sparse-defect"

[tool.setuptools.packages.find]
include = ["sds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
